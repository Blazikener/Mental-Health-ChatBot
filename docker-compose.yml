

services:
  chatbot:
    build: .
    volumes:
      - ./.env:/app/.env
      - chroma_data:/app/chroma_db
      - db_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=sqlite:////data/user.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  chroma_data:
  db_data: